name: CI and Deploy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: uv sync --locked --python 3.10

      - name: Run tests
        run: make test

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: [self-hosted, linux, ARM64, rpi5-beerbot]
    concurrency:
      group: interbotix-production-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0

      - name: Update canonical checkout
        run: bash scripts/update-deployment-checkout.sh

      - name: Deploy application
        run: bash /home/emackinnon1/InterbotixControlServer/scripts/deploy.sh